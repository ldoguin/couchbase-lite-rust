[package]
name = "couchbase_lite"
description = "Rust bindings for Couchbase Lite C"
# The first three numbers correspond to the Couchbase Lite C release, the fourth number corresponds to the Rust release
version = "4.1.0-0"

edition = "2024"

license-file = "libcblite_enterprise/LICENSE.txt"
keywords = ["couchbase"]
categories = ["database"]

[dependencies]
bitflags = "2.9.0"
enum_primitive = "0.1.1"
aes-gcm = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }

[dev-dependencies]
lazy_static = "1.5.0"
regex = "1.11.1"
serde_json = "1"
tempdir = "0.3.7"

[dev-dependencies.reqwest]
version = "0.13.0"
default-features = false
features = ["blocking", "json"]

[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
features = ["user-hooks"]

[build-dependencies]
bindgen = "0.72.0"
fs_extra = "1.2.0"

[lib]
bench = false
doctest = false
crate-type = ["lib", "dylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
incremental = false
# See: https://github.com/johnthagen/min-sized-rust

[features]
# Enable this feature for Enterprise edition capabilities:
# - Database encryption (EncryptionKey, change_encryption_key)
# - P2P replication (local database endpoints)
# - Document property encryption/decryption during replication (Encryptable)
# - TLS identity management (Cert, KeyPair, TLSIdentity)
# - URL endpoint listener for peer-to-peer sync (UrlEndpointListener)
# - Vector search indexes (VectorIndexConfiguration, IndexUpdater)
# - Predictive queries (PredictiveModel, register/unregister)
# - Certificate-based replication auth (Authenticator::create_certificate)
# - Server certificate inspection (Replicator::server_certificate)
enterprise = ["dep:aes-gcm", "dep:getrandom"]

unsafe-threads-test = []
